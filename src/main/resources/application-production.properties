spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/quickbite}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driverClassName=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Strictly use Flyway in production, no auto-ddl
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Security defaults for Prod
server.port=${PORT:8080}
server.tomcat.remoteip.internal-proxies=.*
cookie.secure=true
cors.allowed-origins=${CORS_ORIGINS:${FRONTEND_URL:http://localhost:3000,http://localhost:3001}}
app.frontend.url=${FRONTEND_URL:http://localhost:3000}
quickbite.jwt.secret=${QUICKBITE_JWT_SECRET:${JWT_SECRET}}

# Demo data seeding
quickbite.seed.target-restaurants=${SEED_TARGET_RESTAURANTS:84}

# Logging
logging.level.root=INFO
logging.level.com.quickbite=INFO
