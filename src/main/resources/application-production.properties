spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/quickbite}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driverClassName=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Strictly use Flyway in production, no auto-ddl
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Security defaults for Prod
server.tomcat.remoteip.internal-proxies=.*
cookie.secure=true
cors.allowed-origins=${CORS_ORIGINS:https://quickbite.production.com}

# Logging
logging.level.root=INFO
logging.level.com.quickbite=INFO
