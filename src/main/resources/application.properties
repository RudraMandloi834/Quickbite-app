spring.datasource.url=jdbc:h2:file:./quickbite_db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true

razorpay.key-id=rzp_test_dummy
razorpay.key-secret=dummysecret

spring.jpa.properties.hibernate.jdbc.batch_size=1000
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

spring.security.oauth2.client.registration.google.client-id=dummy-id
spring.security.oauth2.client.registration.google.client-secret=dummy-secret
spring.security.oauth2.client.registration.google.scope=profile,email

# Demo data seeding
quickbite.seed.target-restaurants=${SEED_TARGET_RESTAURANTS:10000}
quickbite.seed.batch-size=${SEED_BATCH_SIZE:1000}
quickbite.seed.async=${SEED_ASYNC:false}
quickbite.seed.enabled=${SEED_ENABLED:true}

# Test account bootstrap (default for dev/local)
quickbite.auth.seed-test-accounts=${QUICKBITE_SEED_TEST_ACCOUNTS:true}
quickbite.auth.test-password=${QUICKBITE_TEST_PASSWORD:dev123}
quickbite.auth.admin-email=${QUICKBITE_ADMIN_EMAIL:admin@test.com}
quickbite.auth.admin-password=${QUICKBITE_ADMIN_PASSWORD:dev123}

